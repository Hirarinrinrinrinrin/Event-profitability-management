<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Event-profitability-management/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004d80" />
    <meta name="description" content="出店の売上・経費・利益を管理するPWAアプリ" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/Event-profitability-management/manifest.json" />

    <!-- iOS support -->
    <link rel="apple-touch-icon" href="/Event-profitability-management/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="出店ノート" />

    <title>出店ノート</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        const isLocalhost = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
        if (isLocalhost) {
          // 開発時はSWを使わない。古いキャッシュを配信し続ける事故を防ぐため、
          // 既存のSWを解除しキャッシュも削除する。
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((r) => r.unregister());
          });
          if (window.caches) {
            caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
          }
        } else {
          // 新しいSWが制御を引き継いだら自動でリロードして最新コードに更新する
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
          window.addEventListener('load', () => {
            navigator.serviceWorker
              .register('/Event-profitability-management/sw.js')
              .then((registration) => {
                console.log('SW registered:', registration.scope);
              })
              .catch((error) => {
                console.log('SW registration failed:', error);
              });
          });
        }
      }
    </script>
  </body>
</html>
